version: '3.8'

services:
  fantasy-hockey-hub:
    build: .
    container_name: fantasy-hockey-hub
    restart: unless-stopped
    ports:
      - "8585:8585"
    environment:
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_change_me_123456}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - DATA_DIR=/data
      - YAHOO_CLIENT_ID=${YAHOO_CLIENT_ID:-}
      - YAHOO_CLIENT_SECRET=${YAHOO_CLIENT_SECRET:-}
      - YAHOO_REDIRECT_URI=${YAHOO_REDIRECT_URI:-http://localhost:8585/auth/yahoo/callback}
      - DEV_MOCK_DATA=${DEV_MOCK_DATA:-false}
    volumes:
      - ./data:/data
